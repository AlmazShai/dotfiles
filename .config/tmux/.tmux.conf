set-window-option -g mode-keys vi
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000

# Move the current window left/right in the window list.
bind-key < swap-window -t -1\; select-window -t -1
bind-key > swap-window -t +1\; select-window -t +1

# Same thing without the prefix, since reordering is usually several presses.
#
# Alt, not Ctrl. Ctrl with punctuation has no legacy encoding and exists only as
# a CSI-u sequence, and the obvious C-< / C-> are doubly out of reach: they are
# ctrl+shift+comma and ctrl+shift+period, which kitty binds to move_tab_backward
# and move_tab_forward and never forwards. Alt is sent as a plain escape prefix,
# needs no negotiation, is not claimed by kitty, and needs no Shift.
bind-key -n M-, swap-window -t -1\; select-window -t -1
bind-key -n M-. swap-window -t +1\; select-window -t +1

# ── Projects ────────────────────────────────────────────────────────────────
# One session per project. <prefix>f opens a finder: pick a project and it
# switches to that session, creating it first if it does not exist yet. Safe to
# mash -- picking the project you are already in is a no-op.
#
# This replaces find-window, which the session picker and <prefix>w cover.
# p and C-p are left alone: they are previous-window.
#
# The project list lives in ~/.config/tmux/projects. Add to it by running
# `tp add` in a directory; nothing is discovered automatically.
bind-key f display-popup -E -w 70% -h 60% "$HOME/.local/bin/tmux-sessionizer"

# Killing a session should drop you into another one rather than throwing you
# out of tmux entirely.
set -g detach-on-destroy off

# Closing a window in the middle should not leave a gap in the numbering.
set -g renumber-windows on

# With a session per project, the session name is the single most useful thing
# on screen: it tells you which project you are typing into.
set -g status-left "#[bold] #S #[default] "
set -g status-left-length 30

# Edit and reload without restarting the server.
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
